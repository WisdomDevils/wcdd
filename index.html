<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wcdd.de</title>
  <meta name="theme-color" content="#050508" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <div class="glow glow-c" aria-hidden="true"></div>
  <div class="glow glow-d" aria-hidden="true"></div>
  <div class="spot" aria-hidden="true"></div>
  <div class="beams" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="veil" class="veil" aria-hidden="true"></div>
  <main class="stage">
    <div class="frame" id="frame">
      <div class="shine" id="shine" aria-hidden="true"></div>
      <div id="ghost" class="ghost" aria-hidden="true"></div>
      <img class="poster" id="poster" src="poster.jpg" alt="本群含有且不限于以下内容" />
    </div>
  </main>
  <div id="cursor" class="cursor" aria-hidden="true">
    <span class="cursor-core"></span>
    <span class="cursor-ring"></span>
    <span class="cursor-ring2"></span>
  </div>
  <canvas id="bolts" aria-hidden="true"></canvas>
  <canvas id="trail" aria-hidden="true"></canvas>
  <span class="mark">wcdd.de</span>
  <script src="app.js?v=5"></script>
</body>
</html>
